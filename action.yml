name: 'Dump SQL database'
description: 'Connect to server and create an SQL dump to retrieve'
inputs:
  ssh_user:
    description: 'SSH user account'
    required: true
  ssh_host:
    description: 'SSH host server'
    required: true
  ssh_key:
    description: 'SSH private key'
    required: true
  ssh_user_jumphost:
    description: 'SSH user account for jumphost'
    required: false
    default: ''
  ssh_host_jumphost:
    description: 'SSH host server for jumphost'
    required: false
    default: ''
  project_dir:
    description: 'Absolute path to the Drupal home directory (where web folder is located)'
    required: true
  sql_dump_file:
    description: 'Absolute path to the SQL dump file (without .gz extension)'
    required: true
  nextcloud_user:
    description: 'Nextcloud username (WebDAV auth)'
    required: true
  nextcloud_app_password:
    description: 'Nextcloud app password (WebDAV auth)'
    required: true
  nextcloud_path:
    description: 'Project folder path in Nextcloud'
    required: true
  nextcloud_base_url:
    description: 'Nextcloud base URL'
    required: false
    default: 'https://drive.eaudeweb.ro'

runs:
  using: "composite"
  steps:
    - name: 'Configure SSH'
      if:  ${{ inputs.ssh_host_jumphost == '' }}
      run: |
        mkdir -p ~/.ssh/
        echo "$SSH_KEY" > ~/.ssh/server.key
        chmod 600 ~/.ssh/server.key
        cat > ~/.ssh/config <<END
        Host server
          HostName $SSH_HOST
          User $SSH_USER
          IdentityFile ~/.ssh/server.key
          StrictHostKeyChecking no
        END
      env:
        SSH_USER: ${{ inputs.ssh_user }}
        SSH_HOST: ${{ inputs.ssh_host }}
        SSH_KEY: ${{ inputs.ssh_key }}
      shell: bash

    - name: 'Configure SSH'
      if:  ${{ inputs.ssh_host_jumphost != '' }}
      run: |
        mkdir -p ~/.ssh/
        echo "$SSH_KEY" > ~/.ssh/server.key
        chmod 600 ~/.ssh/server.key
        cat > ~/.ssh/config <<END
        Host jumphost
          HostName $SSH_HOST_JUMPHOST
          User $SSH_USER_JUMPHOST
          IdentityFile ~/.ssh/server.key
          StrictHostKeyChecking no
          LogLevel QUIET
        Host server
          HostName $SSH_HOST
          User $SSH_USER
          IdentityFile ~/.ssh/server.key
          StrictHostKeyChecking no
          ProxyJump jumphost
        END
      env:
        SSH_USER: ${{ inputs.ssh_user }}
        SSH_HOST: ${{ inputs.ssh_host }}
        SSH_KEY: ${{ inputs.ssh_key }}
        SSH_USER_JUMPHOST: ${{ inputs.ssh_user_jumphost }}
        SSH_HOST_JUMPHOST: ${{ inputs.ssh_host_jumphost }}
      shell: bash

    - name: 'Dump SQL database'
      run: ssh server 'cd ${{ inputs.project_dir }} && ./vendor/bin/drush sql:dump --extra-dump=--no-tablespaces --result-file ${{ inputs.sql_dump_file }} --gzip'
      shell: bash

    - name: 'Upload database dump to Nextcloud (from server via WebDAV)'
      env:
        NEXTCLOUD_USER: ${{ inputs.nextcloud_user }}
        NEXTCLOUD_APP_PASSWORD: ${{ inputs.nextcloud_app_password }}
        NEXTCLOUD_PATH: ${{ inputs.nextcloud_path }}
        NEXTCLOUD_BASE_URL: ${{ inputs.nextcloud_base_url }}
        SQL_DUMP_FILE: ${{ inputs.sql_dump_file }}
      run: |
        set -euo pipefail

        ssh server "set -euo pipefail
          DUMP_FILE='${SQL_DUMP_FILE}.gz'
          if [ ! -f \"\$DUMP_FILE\" ]; then
            echo 'Dump file not found on server:' \"\$DUMP_FILE\"
            exit 1
          fi

          TARGET_URL='${NEXTCLOUD_BASE_URL}/remote.php/dav/files/${NEXTCLOUD_USER}/${NEXTCLOUD_PATH}/mysql/database.sql.gz'
          echo 'Uploading to:' \"\$TARGET_URL\"

          curl --fail -sS \
            -u '${NEXTCLOUD_USER}:${NEXTCLOUD_APP_PASSWORD}' \
            -T \"\$DUMP_FILE\" \
            \"\$TARGET_URL\"

          echo 'Upload completed.'
        "
      shell: bash
